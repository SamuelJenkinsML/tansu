---
# Build and push the fork's broker image: arm64 to Thyme's ECR, amd64 to GHCR.
#
# Trigger is `push` to main only -- never `pull_request`. This repository is
# public, so that is what keeps a PR from an external fork from ever reaching
# the OIDC role or the package-write token. The trust policy in thyme-infra
# (terraform/modules/ci_build) is scoped to `repo:<repo>:ref:refs/heads/main`,
# which this satisfies without widening.
#
# ECR gets arm64 only: Thyme's demo cluster is Graviton throughout, so a
# multi-arch manifest there would be half wasted build time. Running on a native
# arm64 runner also avoids QEMU-emulating a workspace built with
# codegen-units = 1 and thin LTO, which is the difference between minutes and an
# hour. Thyme's CI needs amd64 instead, which `publish-ghcr` builds natively.
#
# The repo Dockerfile cross-builds a static musl binary with --all-features, so
# nvme:// is included. Consumers pin the git-<sha> tag: a benchmark result that
# cannot name the exact image it ran is not reproducible (TH-235).
name: publish-image

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  IMAGE_NAME: thyme/tansu

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}
        with:
          context: .
          push: true
          platforms: linux/arm64
          provenance: false
          tags: |
            ${{ env.IMAGE }}:git-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-arm64
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-arm64,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Report pinned tag
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}
        run: |
          echo "### Broker image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "TANSU_IMAGE=${IMAGE}:git-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Public amd64 image on GHCR, for Thyme's CI (TH-377).
  #
  # Thyme's e2e job runs on GitHub's x86 runners with no AWS credentials, so it
  # can pull neither the arm64 image above nor anything from private ECR. This
  # builds the same Dockerfile for linux/amd64 on a native x86 runner and pushes
  # it with the workflow's own GITHUB_TOKEN: no cloud role is involved, so the
  # push-to-main trigger is the only thing that can publish here.
  #
  # Separate job, not a second platform on `publish`: an ECR/OIDC failure must
  # not block the CI image, and the two builds share no runner architecture.
  #
  # The package must be public for Thyme's CI to pull it anonymously. GHCR
  # creates a new package private; flip it once in the package settings.
  # ---------------------------------------------------------------------------
  publish-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase, and the owner here is not.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ steps.image.outputs.name }}:git-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-amd64
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-amd64,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Report pinned tag
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          echo "### CI broker image published (amd64)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "TANSU_IMAGE=${IMAGE}:git-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Kafka client-compatibility suites (librdkafka + franz-go), packaged to run
  # as a Job against a deployed broker (TH-235).
  #
  # Separate job, not a second step: it shares nothing with the broker build
  # (different base image, different toolchains) so serialising them would only
  # add wall-clock. It is deliberately NOT a dependency of the broker publish --
  # a compat-image build failure must not block shipping the broker.
  #
  # The suites are compiled at image-build time, so this is slow (~15 min: a C
  # configure+make and a Go build) and rarely needs to change. It is therefore
  # gated to workflow_dispatch rather than running on every push to main; the
  # image only needs rebuilding when compat/ or the pinned client versions move.
  # ---------------------------------------------------------------------------
  publish-compat:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/thyme/tansu-compat
        with:
          context: .
          file: compat/Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          tags: |
            ${{ env.IMAGE }}:git-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-arm64
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-arm64,mode=max,image-manifest=true,oci-mediatypes=true
